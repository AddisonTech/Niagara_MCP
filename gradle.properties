# Generic build settings. Machine-specific values (niagara_home,
# org.gradle.java.home) go in ~/.gradle/gradle.properties, never here.

# vendorVersion written to the module manifest.
moduleVersion=0.5.3

# Tridium Gradle plugin versions shipped with Niagara 4.15.4
# ($niagara_home/etc/m2/repository/com/tridium/tools). Override with -P
# when building against a different Niagara release.
niagaraGradlePluginVersion=7.6.22
niagaraSettingsPluginVersion=7.6.3

# Sign the module jar. Requires a signing profile (see BUILDING.md).
niagaramcp.sign=false

org.gradle.jvmargs=-Dfile.encoding=UTF-8
